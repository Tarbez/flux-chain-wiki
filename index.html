<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; font-src 'self' file:; img-src 'self' file: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="no-referrer" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SUBZERO</title>
<meta name="description" content="Below the visual architecture of meaning and design. Building truly rich experiences." />

<!-- Tells the stylesheet JS is available, so the fallback copy does not flash before the scene paints. -->
<script src="js/bootstrap.js"></script>

<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/fallback.css" />
<link rel="stylesheet" href="css/studio.css" />
<link rel="stylesheet" href="css/hero-motion.css" />
<link rel="stylesheet" href="css/zero-webgl.css" />
<link rel="stylesheet" href="css/learnings.css" />
<link rel="stylesheet" href="css/navigation.css" />
<link rel="stylesheet" href="css/focus.css" />
<link rel="stylesheet" href="css/settings.css" />
<link rel="stylesheet" href="css/page-layout.css" />
<link rel="stylesheet" href="css/home.css" />
</head>
<body>

<!-- The scene host. Empty on purpose: the Ark UI runtime fills it from the
     single F-SCENE-RZERO_V0 pattern in js/scene.flux.js. No scene markup is
     authored by hand. -->
<main id="main">
<div id="scene"></div>

<!-- Semantic fallback — the page with JavaScript off, and the reading order
     for screen readers once the poster is up. -->
<section id="fallback" aria-label="Introduction">
  <div class="wrap">
    <p class="brand">SUBZERO</p>
    <p class="eyebrow">Concept of subzero &gt; Sub &gt; ZERO</p>
    <h1>SUB</h1>
    <p>
      Below the visual architecture of meaning and design. Building truly rich experiences.
    </p>
  </div>
</section>

</main>


<!-- Classic scripts, in dependency order. Deliberately not ES modules: those
     are blocked on file://, and this page should open with a double-click.
     Every file only defines something; js/main.js is the one that runs. -->

<!-- 1. design tokens -->
<script src="js/tokens.js" defer></script>

<!-- 2. runtime: atomizer -> flux parser -> prop readers -> registry/renderer -->
<script src="js/content/copy.js" defer></script>
<script src="js/ark/atomizer.js" defer></script>
<script src="js/ark/flux.js" defer></script>
<script src="js/ark/props.js" defer></script>
<script src="js/ark/runtime.js" defer></script>
<script src="js/ark/vendor/engines.js" defer></script>
<script src="js/content/learnings.js" defer></script>
<script src="js/content/theory.js" defer></script>
<script src="js/ark/text-scramble.js" defer></script>
<script src="js/ark/text-presence.js" defer></script>
<script src="js/ark/scene-state.js" defer></script>
<script src="js/ark/mesh-drag.js" defer></script>
<script src="js/pages/catalog.js" defer></script>
<script src="js/ark/page-loader.js" defer></script>
<script src="js/ark/page-router.js" defer></script>

<!-- 3. the grain painter the halo resolver calls -->
<script src="js/halo/grain.js" defer></script>

<!-- 4. resolvers, one file per concern -->
<script src="js/resolvers/layer.js" defer></script>
<script src="js/resolvers/scene.js" defer></script>
<script src="js/resolvers/halo.js" defer></script>
<script src="js/resolvers/veil.js" defer></script>
<script src="js/resolvers/header.js?v=2" defer></script>
<script src="js/resolvers/nav.js?v=2" defer></script>
<script src="js/resolvers/body.js" defer></script>

<!-- 5. the pattern, then boot. (The header, footer, progress-pill and subtitle
     components live, unloaded, in js/resolvers/optional/. See README.md.) -->
<script src="js/scene.flux.js" defer></script>
<script src="js/main.js?v=2" defer></script>
<script src="js/halo/proximity.js" defer></script>
<script src="js/halo/words.js" defer></script>
<script src="js/halo/surface-motion.js" defer></script>
<script src="js/halo/iceberg.js" defer></script>
<script src="js/halo/shaders.js" defer></script>
<script src="js/zero-webgl.js?v=12" defer></script>
<script src="js/hero-motion.js?v=13" defer></script>
<script src="js/settings/panel.js" defer></script>
</body>
</html>
