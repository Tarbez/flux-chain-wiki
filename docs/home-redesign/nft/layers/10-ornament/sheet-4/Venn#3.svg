<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" data-slot="ornament">
  <title>Venn: two overlapping circles on an axis, with dots at both ends and a cyan dot at the centre (sheet-4, 23). It prints the card's the name and the network.</title>
  <path d="M8 40H352" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <circle cx="164" cy="40" r="26" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <circle cx="196" cy="40" r="26" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <circle cx="8" cy="40" r="2.2" fill="var(--ink)"/><circle cx="352" cy="40" r="2.2" fill="var(--ink)"/><circle cx="180" cy="40" r="2.6" fill="var(--acc)"/>
  <text x="8" y="30" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="0.5" fill="var(--referential)" data-field="name">NAME</text>
  <text x="8" y="58" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="var(--dim)">NAME</text>
  <text x="352" y="30" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="0.5" fill="var(--ink)" data-field="network" text-anchor="end">NETWORK</text>
  <text x="352" y="58" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="var(--dim)" text-anchor="end">NETWORK</text>
</svg>
