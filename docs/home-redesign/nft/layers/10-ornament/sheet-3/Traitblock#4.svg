<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" data-slot="ornament">
  <title>Traitblock: a notched MARK tab, the mark's name large over a dotted rule, the palette as a caption and the status dot (sheet-3, 02)</title>
  <g transform="translate(0 4)">
    <path d="M0 2H52L64 18H0Z" fill="var(--faint)"/>
    <path d="M0.5 17.5V2.5H52L63 17.5" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="17.5" x2="250" y2="17.5" stroke="var(--rule)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <text x="8" y="14" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="var(--dim)">MARK</text>
    <text x="0" y="45" font-family="JetBrains Mono, monospace" font-size="22" font-weight="500" letter-spacing="1.76" fill="var(--ink)" data-field="mark">GLITCH</text>
    <circle cx="245" cy="37" r="6.5" fill="var(--state)" opacity=".18"/>
    <circle cx="245" cy="37" r="3.2" fill="var(--state)"/>
    <line x1="0" y1="51.5" x2="250" y2="51.5" stroke="var(--line)" stroke-width="1" stroke-dasharray="1 3" vector-effect="non-scaling-stroke"/>
    <text x="0" y="68" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.8" fill="var(--dim)">PALETTE</text>
    <text x="62" y="68.5" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2.6" fill="var(--dim)" data-field="palette">MONO</text>
  </g>
</svg>
