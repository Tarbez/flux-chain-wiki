<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" data-slot="ornament">
  <title>Bracketlist: the genesis ID in square brackets, beside a short list of the mark, the palette and the role (sheet-3, 08)</title>
  <g transform="translate(0 2)">
    <path d="M8.5 12.5H0.5V66.5H8.5M71.5 12.5H79.5V66.5H71.5" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <text x="40.9" y="47.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="22" font-weight="500" letter-spacing="1.76" fill="var(--ink)" data-field="genesisId">009</text>
    <g fill="var(--acc)">
      <rect x="98" y="21" width="3" height="3"/>
      <rect x="98" y="39" width="3" height="3"/>
      <rect x="98" y="57" width="3" height="3"/>
    </g>
    <g font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2.6">
      <text x="110" y="27" font-weight="500" fill="var(--ink)" data-field="mark">GLITCH</text>
      <text x="110" y="45" fill="var(--dim)" data-field="palette">MONO</text>
      <text x="110" y="63" fill="var(--dim)" data-field="role">PROTOCOL</text>
    </g>
  </g>
</svg>
