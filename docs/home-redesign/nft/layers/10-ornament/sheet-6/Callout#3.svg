<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" data-slot="ornament">
  <title>Callout: a box holding the card's role and network, with a leader line to a small square</title>
  <rect x="0.5" y="12.5" width="214" height="52" fill="none" stroke-width="1" vector-effect="non-scaling-stroke" stroke="var(--line)"/>
  <g font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.65">
    <text x="12" y="33" fill="var(--dim)">ROLE</text><text x="96" y="33" fill="var(--ink)" data-field="role">ROLE</text>
    <text x="12" y="53" fill="var(--dim)">NETWORK</text><text x="96" y="53" fill="var(--ink)" data-field="network">NETWORK</text>
  </g>
  <path d="M214.5 38.5H290L310 18.5" fill="none" stroke-width="1" vector-effect="non-scaling-stroke" stroke="var(--line)"/>
  <rect x="307" y="12.5" width="6" height="6" fill="var(--ink)"/>
</svg>
