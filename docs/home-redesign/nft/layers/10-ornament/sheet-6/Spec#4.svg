<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" data-slot="ornament">
  <title>Spec: the card's mark and palette as a key and value block</title>
  <g font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2.4">
    <text x="0" y="24" fill="var(--dim)">MARK</text><text x="114" y="24" fill="var(--dim)">:</text>
    <text x="132" y="24" fill="var(--ink)" data-field="mark">MARK</text>
    <text x="0" y="52" fill="var(--dim)">PALETTE</text><text x="114" y="52" fill="var(--dim)">:</text>
    <text x="132" y="52" fill="var(--ink)" data-field="palette">PALETTE</text>
  </g>
</svg>
