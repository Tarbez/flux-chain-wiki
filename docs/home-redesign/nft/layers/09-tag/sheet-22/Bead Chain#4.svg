<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 50" data-slot="tag">
  <title>Bead Chain: a ring bead holding the status dot, linked to a status pill, a small accent bead, then a role pill (sheet 22)</title>
  <rect x="34.5" y="14.5" width="100" height="21" rx="10.5" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <rect x="150.5" y="14.5" width="112" height="21" rx="10.5" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <circle cx="12.5" cy="25" r="11" fill="var(--faint)" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <circle cx="12.5" cy="25" r="4.6" fill="var(--state)"/>
  <path d="M23.5 25H34.5M134.5 25H150.5" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <circle cx="142.5" cy="25" r="2.3" fill="var(--acc)"/>
  <text x="47" y="29" font-family="JetBrains Mono, monospace" font-size="11.5" letter-spacing="2.2" font-weight="500" fill="var(--ink)" data-field="status">STATUS</text>
  <text x="163" y="29" font-family="JetBrains Mono, monospace" font-size="11.5" letter-spacing="2.2" fill="var(--dim)" data-field="role">ROLE</text>
</svg>
