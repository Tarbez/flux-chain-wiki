  <rect x="0.5" y="9.5" width="250" height="31" rx="15.5" fill="none" stroke="var(--acc)" stroke-width="2.5" opacity="0.15"/>
  <rect x="0.5" y="9.5" width="250" height="31" rx="15.5" fill="none" stroke="var(--acc)" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.7"/>
  <circle cx="18" cy="25" r="7.5" fill="var(--state)" opacity="0.07"/>
  <circle cx="18" cy="25" r="5.3" fill="var(--state)" opacity="0.25"/>
