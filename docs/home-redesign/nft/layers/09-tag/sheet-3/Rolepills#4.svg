<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 50" data-slot="tag">
  <title>Rolepills: three outlined pills; the role is the selected one, then the network and the palette (sheet-3, 05)</title>
  <g transform="translate(0 5)">
    <rect x="0.5" y="6.5" width="88" height="22" rx="11" fill="var(--faint)" stroke="var(--acc)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <rect x="96.5" y="6.5" width="80" height="22" rx="11" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <rect x="184.5" y="6.5" width="88" height="22" rx="11" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <text x="45" y="22" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" letter-spacing="1" fill="var(--acc)" data-field="role">PROTOCOL</text>
    <text x="137" y="22" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1" fill="var(--dim)" data-field="network">DEFXN</text>
    <text x="229" y="22" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1" fill="var(--dim)" data-field="palette">MONO</text>
  </g>
</svg>
