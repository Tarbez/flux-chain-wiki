<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 50" data-slot="tag">
  <title>Swatch: the PALETTE label and a rounded pill holding a ring in the accent colour and the palette's name (sheet-3, 15)</title>
  <g transform="translate(0 5)">
    <text x="0" y="21.5" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="var(--dim)">PALETTE</text>
    <rect x="66.5" y="6.5" width="110" height="22" rx="11" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <circle cx="81" cy="17.5" r="3.5" fill="none" stroke="var(--acc)" stroke-width="1.3"/>
    <text x="92" y="22" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" letter-spacing="1.3" fill="var(--ink)" data-field="palette">MONO</text>
  </g>
</svg>
