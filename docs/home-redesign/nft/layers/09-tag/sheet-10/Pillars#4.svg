<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 50" data-slot="tag">
  <title>Pillars: the genesis ID in large digits between a tall accent bar and a short grey one, with GENESIS ID beside it (sheet 10, 05-01)</title>
  <rect x="0" y="3" width="5" height="44" fill="var(--acc)" opacity="0.1"/>
  <rect x="1.6" y="4" width="1.8" height="42" fill="var(--acc)"/>
  <text x="14" y="36" font-family="JetBrains Mono, monospace" font-size="27" letter-spacing="1.5" fill="var(--ink)" data-field="genesisId">GENESISID</text>
  <rect x="100" y="13" width="1.2" height="24" fill="var(--dim)"/>
  <rect x="104" y="6" width="1" height="38" fill="var(--faint)"/>
  <text x="116" y="22" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.2" fill="var(--dim)">GENESIS</text>
  <text x="116" y="35" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.2" fill="var(--dim)">ID</text>
</svg>
