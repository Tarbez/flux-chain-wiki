<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 50" data-slot="tag">
  <title>Truss Tag: a long hexagon with pointed ends, like a truss chord: GEN and the genesis number, a web strut with an accent pin, then the role (sheet 26, the Truss set: a girder: two rails with a zigzag web between them, round pins at the joints, one pin in the accent)</title>
  <path d="M13 8.5H240L252.5 25L240 41.5H13L0.5 25Z" fill="var(--faint)" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-linejoin="miter"/>
  <text x="17" y="28.4" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.6" fill="var(--dim)">GEN</text>
  <text x="44" y="29.6" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1.8" font-weight="500" fill="var(--ink)" data-field="genesisId">000</text>
  <path d="M98 8.5L108 41.5L118 8.5" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-opacity="0.7"/>
  <circle cx="108" cy="41.5" r="2.6" fill="var(--acc)"/>
  <text x="128" y="29.6" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1.8" font-weight="500" fill="var(--ink)" data-field="role">ROLE</text>
</svg>
