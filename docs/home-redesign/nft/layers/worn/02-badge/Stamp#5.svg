  <rect x="4" y="4" width="112" height="24" fill="none" stroke="var(--rule)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <rect x="1" y="1" width="3" height="3" fill="var(--primary)"/>
  <rect x="116" y="1" width="3" height="3" fill="var(--primary)"/>
  <rect x="1" y="28" width="3" height="3" fill="var(--primary)"/>
  <rect x="116" y="28" width="3" height="3" fill="var(--primary)"/>
