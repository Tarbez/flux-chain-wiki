<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" data-slot="badge">
  <title>Double: a hairline outline and a fainter one inside it</title>
  <rect x="1" y="1" width="118" height="30" rx="6" fill="none" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <rect x="4" y="4" width="112" height="24" rx="4" fill="none" stroke="var(--faint)" stroke-width="1" vector-effect="non-scaling-stroke"/>
</svg>
