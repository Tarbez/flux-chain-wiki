<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 8" data-slot="link">
  <title>Double: a referential underline over a faint second line</title>
  <line x1="0" y1="3" x2="120" y2="3" stroke="var(--referential)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  <line x1="0" y1="6" x2="120" y2="6" stroke="var(--faint)" stroke-width="1" vector-effect="non-scaling-stroke"/>
</svg>
