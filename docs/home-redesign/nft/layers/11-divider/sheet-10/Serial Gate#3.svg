  <rect x="150" y="1" width="1" height="22" fill="var(--faint)"/>
  <rect x="157" y="4" width="1.6" height="16" fill="var(--acc)"/>
  <text x="180" y="16.8" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2" fill="var(--ink)" data-field="serial" text-anchor="middle">SERIAL</text>
  <rect x="201.4" y="4" width="1.6" height="16" fill="var(--acc)"/>
  <rect x="209" y="1" width="1" height="22" fill="var(--faint)"/>
  <path d="M214 12.5H360" fill="none" stroke="var(--rule)" stroke-width="1" vector-effect="non-scaling-stroke"/>
</svg>
