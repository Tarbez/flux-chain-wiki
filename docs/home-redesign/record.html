<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Record · DEFXN mockup</title>
<!-- Forwards to the one mockup app (home-mockup.html), so a link to this page lands in the same
     world with no reload between views. The record (?r=) and, for the open record, the tab
     (#history, #connections) carry over. -->
<script>
  (function () {
    var q = location.search.replace(/^\?/, ''), tab = location.hash.replace(/^#/, '');
    var parts = [];
    if (q) parts.push(q);
    if ('record' === 'open' && tab) parts.push('tab=' + tab);
    location.replace('home-mockup.html#/record' + (parts.length ? '?' + parts.join('&') : ''));
  })();
</script>
<meta http-equiv="refresh" content="0; url=home-mockup.html#/record">
</head>
<body style="background:#0a100d;color:#c3cdd6;font:14px system-ui"><a href="home-mockup.html#/record">Record</a></body>
</html>
