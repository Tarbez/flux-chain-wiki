<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="no-referrer" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mesh site</title>
<meta name="description" content="A site hosted on the Flux mesh, resolved live from its .fxn name." />
<meta name="robots" content="noindex" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --surface: #ffffff;
    --border: #e6e4df;
    --text: #191815;
    --text-muted: #6b6860;
    --text-faint: #96938a;
    --accent: #0f62fe;
    --accent-ink: #ffffff;
    --danger: #b3261e;
    --radius: 10px;
    --max-width: 760px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --surface: #191919;
      --border: #2d2d2d;
      --text: #f0efec;
      --text-muted: #a8a59c;
      --text-faint: #716e66;
      --accent: #6ea8ff;
      --accent-ink: #0b1220;
      --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    line-height: 1.55;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  header {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 24px;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  header .site-name {
    font-weight: 650;
    font-size: 1.02rem;
    letter-spacing: -0.01em;
  }
  header .mesh-name {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.74rem;
    color: var(--text-faint);
    font-family: var(--font-mono);
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  header .mesh-name::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2ea043;
    flex-shrink: 0;
  }
  nav#site-nav {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-left: auto;
  }
  nav#site-nav a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.9rem;
    padding: 6px 10px;
    border-radius: 7px;
  }
  nav#site-nav a:hover { color: var(--text); background: var(--border); }
  nav#site-nav a[aria-current="page"] { color: var(--text); font-weight: 600; background: var(--border); }

  main {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 48px 24px 96px;
  }
  main h1 {
    font-size: 1.75rem;
    letter-spacing: -0.015em;
    margin: 0 0 28px;
  }
  main h2 { font-size: 1.15rem; margin: 28px 0 8px; }
  .field { margin-bottom: 24px; }
  .field-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .field-value { white-space: pre-wrap; color: var(--text); }

  .article-list { list-style: none; padding: 0; margin: 0; }
  .article-list li { border-bottom: 1px solid var(--border); }
  .article-list li:last-child { border-bottom: none; }
  .article-list a {
    display: block;
    padding: 16px 4px;
    color: var(--text);
    font-weight: 550;
    text-decoration: none;
  }
  .article-list a:hover { color: var(--accent); }

  .not-found {
    padding: 48px 0;
    color: var(--text-muted);
  }

  .status-page {
    max-width: 480px;
    margin: 0 auto;
    padding: 96px 24px;
    text-align: center;
  }
  .status-page .status-icon {
    width: 40px;
    height: 40px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: var(--text-faint);
  }
  .status-page[data-tone="error"] .status-icon { color: var(--danger); border-color: var(--danger); }
  .status-page h1 {
    font-size: 1.2rem;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .status-page p {
    color: var(--text-muted);
    margin: 0 auto;
    font-size: 0.92rem;
  }
  .status-code {
    display: inline-block;
    margin-top: 20px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-faint);
    padding: 3px 9px;
    border: 1px solid var(--border);
    border-radius: 999px;
  }

  footer {
    text-align: center;
    padding: 20px 24px 32px;
    font-size: 0.74rem;
    color: var(--text-faint);
  }
  footer .verified {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  footer .verified::before { content: "✓"; color: #2ea043; font-weight: 700; }

  @media (max-width: 520px) {
    header { padding: 12px 16px; }
    nav#site-nav { margin-left: 0; width: 100%; }
    main { padding: 32px 16px 72px; }
  }
</style>
</head>
<body>
<div id="app" role="main" aria-live="polite">
  <div class="status-page"><div class="status-icon">···</div><h1>Loading…</h1></div>
</div>
<footer id="page-footer">Served from the Flux mesh</footer>
<script type="module" src="app.js"></script>
</body>
</html>
