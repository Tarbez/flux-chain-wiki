<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="no-referrer" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mesh site</title>
<meta name="description" content="A site hosted on the Flux mesh, resolved live from its .fxn name." />
<meta name="robots" content="noindex" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    background: #fff;
    color: #141414;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121212; color: #ededed; }
    a { color: #8ab4ff; }
    header { border-bottom-color: #2a2a2a !important; }
    .asset-pill { background: #1f1f1f !important; border-color: #333 !important; }
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid #e3e3e3;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  header .site-name { font-weight: 600; font-size: 1.05rem; }
  header .mesh-name { font-size: 0.8rem; opacity: 0.6; font-family: ui-monospace, Menlo, monospace; }
  nav#site-nav { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  nav#site-nav a { color: inherit; text-decoration: none; font-size: 0.92rem; opacity: 0.8; }
  nav#site-nav a:hover, nav#site-nav a[aria-current="page"] { opacity: 1; text-decoration: underline; }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  main h1 { font-size: 1.6rem; margin-top: 0; }
  main h2 { font-size: 1.2rem; }
  .field-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.55; margin: 20px 0 4px; }
  .field-value { white-space: pre-wrap; }
  .article-list { list-style: none; padding: 0; }
  .article-list li { padding: 10px 0; border-bottom: 1px solid #eee; }
  .article-list a { color: inherit; font-weight: 500; }
  .status-page { text-align: center; padding: 70px 20px; }
  .status-page h1 { font-size: 1.4rem; }
  .status-page p { opacity: 0.75; max-width: 440px; margin: 10px auto 0; }
  .status-code { font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem; opacity: 0.5; margin-top: 18px; }
  footer { text-align: center; padding: 24px; font-size: 0.75rem; opacity: 0.45; }
</style>
</head>
<body>
<div id="app" role="main" aria-live="polite">
  <div class="status-page"><p>Loading…</p></div>
</div>
<footer>Served from the Flux mesh via this node's local gateway.</footer>
<script type="module" src="app.js"></script>
</body>
</html>
