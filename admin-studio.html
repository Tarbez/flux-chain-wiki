<title>DEFXN Studio</title>

<style>
/* Layout: tool shell. Top bar · left rail (add, layers, pages) · canvas (design or sitemap) · right inspector (element, theme, history) · status bar.
   Volume is turned down everywhere except the one thing that matters: the canvas and the primary action. */
:root {
  --bg: #eef0ec;
  --panel: #fbfcfa;
  --sunk: #e6e9e3;
  --rule: #d6dbd2;
  --ink: #161a15;
  --muted: #5c6459;
  --accent: #2448d8;
  --accent-ink: #ffffff;
  --accent-soft: rgba(36, 72, 216, 0.10);
  --override: #b4520c;
  --ok: #1d7a4a;
  --warn: #a8640b;
  --danger: #b8382a;
  --comp: #7a3fd1;
  --font-ui: "Albert Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111411; --panel: #171b17; --sunk: #0d100d; --rule: #283028; --ink: #e6ebe4; --muted: #949e91;
    --accent: #7b93ff; --accent-ink: #0b0f1f; --accent-soft: rgba(123, 147, 255, 0.14); --override: #f0904a; --ok: #4cc58a; --warn: #e4a54a; --danger: #f07563; --comp: #b590ff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111411; --panel: #171b17; --sunk: #0d100d; --rule: #283028; --ink: #e6ebe4; --muted: #949e91;
  --accent: #7b93ff; --accent-ink: #0b0f1f; --accent-soft: rgba(123, 147, 255, 0.14); --override: #f0904a; --ok: #4cc58a; --warn: #e4a54a; --danger: #f07563; --comp: #b590ff;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 400 13px/1.4 var(--font-ui); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 13px; height: 13px; }

.shell { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 100vh; }
/* top bar */
.bar { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--rule); -webkit-user-select: none; user-select: none; }
.logo { display: flex; align-items: center; gap: 7px; font: 700 14px/1 var(--font-ui); letter-spacing: -0.01em; margin-right: 4px; }
.logo svg { width: 20px; height: 20px; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; border-right: 1px solid var(--rule); background: transparent; padding: 5px 9px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 7px; padding: 5px 10px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.quiet:hover { background: var(--sunk); color: var(--ink); }
.btn.icon { padding: 5px 6px; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .4; cursor: default; }
.pagebtn { max-width: 220px; }
.pagebtn span { overflow: hidden; text-overflow: ellipsis; }
.pagebtn small { color: var(--muted); font: 500 11px/1 var(--font-data); }
.score { font: 600 12px/1 var(--font-ui); }
.score b { font: 600 11.5px/1 var(--font-data); padding: 3px 6px; border-radius: 99px; color: var(--accent-ink); }
.score.good b { background: var(--ok); } .score.mid b { background: var(--warn); } .score.bad b { background: var(--danger); }
.bp-note { font: 500 11.5px/1 var(--font-ui); color: var(--override); display: inline-flex; align-items: center; gap: 4px; }

/* workspace */
.work { display: grid; grid-template-columns: 248px minmax(0, 1fr) 300px; min-height: 0; }
.live .work, .mapview .work { grid-template-columns: minmax(0, 1fr); }
.live .left, .live .right, .mapview .left, .mapview .right { display: none; }
/* restrictMode (Part F): same layout-collapse mechanism as .live/.mapview, but only the
   LEFT rail is given up -- the right rail is repurposed as the mode's own dedicated panel
   (renderElementPane()'s restrictMode branch) instead of being hidden like .live does.
   Canvas mode has nothing to do with individual elements, so it gives up the left rail
   the same way .live does. Animation mode (Part H) is the opposite: picking WHICH element
   to animate is the whole point, so it keeps the left rail's real Layers tree (Part B's
   renderConnectedLayers(), wired through renderLayersPane() below) at the base .work
   grid's normal 3-column layout -- never collapsed to 2 columns like canvas mode. */
.canvas-mode .work { grid-template-columns: minmax(0, 1fr) 300px; }
.canvas-mode .left { display: none; }
@media (max-width: 1100px) { .work { grid-template-columns: 216px minmax(0, 1fr) 272px; } }
@media (max-width: 860px) { .work { grid-template-columns: minmax(0, 1fr); } .left, .right { border: 0 !important; border-top: 1px solid var(--rule) !important; max-height: none !important; } .canvas-wrap { order: -1; } }
.left, .right { background: var(--panel); min-width: 0; overflow: auto; max-height: calc(100vh - 82px); }
.left { border-right: 1px solid var(--rule); -webkit-user-select: none; user-select: none; }
.right { border-left: 1px solid var(--rule); }
.addbar { padding: 10px 10px 8px; }
.addbar .btn { width: 100%; justify-content: center; padding: 8px; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.tabs button { border: 0; background: transparent; padding: 8px 4px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.list { list-style: none; margin: 0; padding: 6px; display: grid; }
.list li { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; white-space: nowrap; min-width: 0; color: var(--ink); }
.list li:hover { background: var(--sunk); }
.list li[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.list li .ic { color: var(--muted); }
.list li[aria-selected="true"] .ic { color: var(--accent); }
.list li .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.list li .sub { color: var(--muted); font: 500 11px/1 var(--font-data); margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
.list li .tag { font: 600 9.5px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 4px; }
.list li.drop-before { border-top-color: var(--accent); }
.list li.drop-after { border-bottom-color: var(--accent); }
.list li.drop-inside { border-color: var(--accent); }
.list li .ov { width: 6px; height: 6px; border-radius: 50%; background: var(--override); flex: none; margin-left: auto; }
.list li .row-act { margin-left: auto; opacity: 0; }
.list li:hover .row-act, .list li[aria-selected="true"] .row-act { opacity: 1; }
.list li .layer-toggle { width: 16px; height: 16px; padding: 0; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; flex: none; }
.list li .layer-toggle::before { content: '›'; font: 700 16px/1 var(--font-ui); transform: rotate(90deg); transition: transform .12s ease; }
.list li .layer-toggle[aria-expanded="false"]::before { transform: rotate(0); }
.list li .layer-spacer { width: 16px; flex: none; }
.railfoot { display: flex; gap: 6px; padding: 4px 10px 12px; flex-wrap: wrap; }

/* canvas */
.canvas-wrap { min-width: 0; overflow: auto; position: relative; padding: 14px 16px 40px; max-height: calc(100vh - 82px); }
.shell:not(.live) .canvas-wrap { -webkit-user-select: none; user-select: none; }
.live .canvas-wrap { padding: 0; }
.stage { position: relative; margin: 0 auto; transform-origin: top left; }
.frame { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 30px rgba(0,0,0,.08); border-radius: 6px; overflow: hidden; }
.cms-preview { display: none; width: 100%; min-height: 720px; border: 0; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 30px rgba(0,0,0,.08); border-radius: 6px; }
.cms-connected .frame { display: none; }
.cms-connected .cms-preview { display: block; }
.cms-connected #btnAdd, .cms-connected #btnNewPage, .cms-connected #btnNewArticle { display: none; }
.cms-connected .ov-box, .cms-connected .ov-pad, .cms-connected .ov-tag, .cms-connected .drop-zone, .cms-connected .drop-line { display: none; }
.live .frame { border-radius: 0; box-shadow: none; }
.live .cms-preview { border-radius: 0; box-shadow: none; pointer-events: auto; }
.devlabel { font: 500 11px/1 var(--font-data); color: var(--muted); margin: 0 auto 8px; display: flex; justify-content: space-between; gap: 8px; }
.live .devlabel { display: none; }
.ov-box { position: absolute; pointer-events: none; border: 1px solid var(--accent); z-index: 3; }
.ov-box.hover { border-style: dashed; opacity: .8; }
.ov-box.multi { border-style: dashed; z-index: 3; }
.ov-pad { position: absolute; pointer-events: none; background: repeating-linear-gradient(45deg, var(--accent-soft), var(--accent-soft) 4px, transparent 4px, transparent 8px); z-index: 2; }
.ov-tag { position: absolute; pointer-events: auto; z-index: 4; display: flex; align-items: stretch; background: var(--accent); color: var(--accent-ink); border-radius: 5px; font: 600 11px/1 var(--font-ui); white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.15); transform-origin: left top; }
.ov-tag span { padding: 5px 7px; display: inline-flex; align-items: center; gap: 5px; }
.ov-tag button { border: 0; background: transparent; color: inherit; padding: 3px 5px; display: grid; place-items: center; border-left: 1px solid rgba(255,255,255,.25); }
.ov-tag button.grip { border-left: 0; border-right: 1px solid rgba(255,255,255,.25); cursor: grab; padding: 3px 6px; }
.ov-tag button.grip:active { cursor: grabbing; }
.live .ov-box, .live .ov-pad, .live .ov-tag { display: none; }
.drop-line { position: absolute; background: var(--accent); z-index: 6; pointer-events: none; border-radius: 3px; box-shadow: 0 0 0 1px var(--panel); }
.drop-zone { position: absolute; border: 2px dashed var(--accent); background: var(--accent-soft); z-index: 5; pointer-events: none; border-radius: 4px; }
.drag-ghost { position: absolute; z-index: 7; pointer-events: none; background: var(--ink); color: var(--bg); font: 600 11.5px/1 var(--font-ui); padding: 6px 9px; border-radius: 6px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.2); transform-origin: left top; }

/* sitemap */
.sitemap { position: relative; }
.smbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 14px; }
.smbar h2 { margin: 0; font-size: 16px; }
.smbar .sum { color: var(--muted); }
.smlegend { display: flex; gap: 12px; color: var(--muted); font-size: 12px; }
.smlegend i { display: inline-block; width: 18px; height: 2px; vertical-align: middle; margin-right: 5px; }
.smscroll { overflow: auto; padding-bottom: 20px; }
.smzoom { position: relative; margin: 0 auto; }
.smcanvas { position: absolute; left: 0; top: 0; }
.smcanvas > svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.smzoomctl { display: inline-flex; align-items: center; gap: 4px; }
.smzoomctl .smzoom-pct { min-width: 46px; text-align: center; }
.smcard { position: absolute; width: 196px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 11px; display: grid; gap: 4px; cursor: pointer; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.smcard:hover { border-color: var(--muted); }
.smcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.smcard.cur { outline: 2px solid var(--accent); outline-offset: 2px; }
.smcard .t { display: flex; align-items: center; gap: 6px; font-weight: 700; min-width: 0; }
.smcard .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.smcard code { font: 500 11px/1.2 var(--font-data); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.smcard .st { font-size: 11.5px; color: var(--muted); }
.smcard .chips { display: flex; gap: 4px; flex-wrap: wrap; min-height: 0; }
.chip { font: 600 10px/1 var(--font-ui); padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; }
.chip.warn { color: var(--warn); } .chip.bad { color: var(--danger); } .chip.info { color: var(--muted); }
.smcard .open { justify-self: start; margin-top: 2px; }

/* inspector */
.ins-head { padding: 10px 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 6px; }
.elhead { display: flex; align-items: center; gap: 6px; }
.elhead .tyb { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--font-ui); padding: 4px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.elhead input { flex: 1; min-width: 60px; border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 4px 5px; font-weight: 600; }
.elhead input:hover, .elhead input:focus { border-color: var(--rule); background: var(--sunk); }
.acc { border-bottom: 1px solid var(--rule); }
.acc > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; font-weight: 600; -webkit-user-select: none; user-select: none; }
.acc > summary::-webkit-details-marker { display: none; }
.acc > summary .ic { color: var(--muted); }
.acc > summary .cnt { font: 600 10.5px/1 var(--font-data); color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 2px 6px; }
.acc > summary .chev { margin-left: auto; transition: transform .15s; }
.acc[open] > summary .chev { transform: rotate(180deg); }
.acc > summary:hover { background: var(--sunk); }
.acc-body { padding: 2px 12px 12px; display: grid; gap: 7px; }
.row { display: grid; grid-template-columns: 74px minmax(0, 1fr) 14px; align-items: center; gap: 6px; min-height: 26px; }
.row > label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.set > label { color: var(--ink); font-weight: 600; }
.row .rst { width: 14px; height: 14px; border: 0; padding: 0; background: transparent; display: grid; place-items: center; }
.row .rst::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: transparent; }
.row.set .rst::after { background: var(--accent); }
.row.set.bpset .rst::after { background: var(--override); }
.row.set .rst:hover::after { background: var(--danger); }
.row.ovr > label { color: var(--comp); }
.row.ovr .rst::after { background: var(--comp) !important; }
.list li.inst .nm, .list li.inst .ic { color: var(--comp); }
.list li.inst-in .nm { color: var(--muted); }
.compbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 auto 10px; padding: 7px 10px; border-radius: 8px; background: var(--comp); color: #fff; font-weight: 600; }
.compbar .spacer { flex: 1; }
.compbar .btn { background: #fff; color: var(--comp); border-color: #fff; }
.compnote { display: grid; gap: 6px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--comp); background: color-mix(in srgb, var(--comp) 8%, transparent); }
.compnote p { margin: 0; font-size: 12px; }
.compnote .acts { display: flex; gap: 5px; flex-wrap: wrap; }
.libsec { padding: 8px 10px; display: grid; gap: 8px; }
.libsec h4 { margin: 4px 2px 0; font: 600 11px/1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.libtile { border: 1px solid var(--rule); border-radius: 9px; background: var(--panel); overflow: hidden; cursor: grab; display: grid; }
.libtile:hover { border-color: var(--comp); }
.libtile .thumb { height: 96px; overflow: hidden; position: relative; background: var(--sunk); border-bottom: 1px solid var(--rule); pointer-events: none; }
.libtile .meta { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 8px; min-width: 0; }
.libtile .meta .ic { color: var(--comp); }
.libtile .meta span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.libtile .meta small { color: var(--muted); margin-left: auto; white-space: nowrap; }
.myrow { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border: 1px solid var(--rule); border-radius: 7px; }
.myrow span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.myrow small { color: var(--muted); }
.pop .field { display: grid; gap: 4px; margin-bottom: 8px; }
.pop .field input, .pop textarea { border: 1px solid var(--rule); border-radius: 7px; padding: 6px 8px; background: var(--panel); }
.pop textarea { width: 100%; min-height: 120px; font: 400 11px/1.4 var(--font-data); }
.pop .row2 { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.ctl-seg { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; min-width: 0; }
.ctl-seg button { flex: 1 1 auto; min-width: 0; border: 0; border-right: 1px solid var(--rule); background: var(--panel); padding: 4px 1px; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; justify-content: center; align-items: center; gap: 3px; }
.ctl-seg button:last-child { border-right: 0; }
.ctl-seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.row.inh .ctl-seg button[aria-pressed="true"] { background: var(--sunk); color: var(--ink); }
select.ctl, input.ctl, textarea.ctl { width: 100%; min-width: 0; border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 4px 6px; }
textarea.ctl { resize: vertical; min-height: 54px; font-size: 12.5px; }
.row.inh select.ctl { color: var(--muted); }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; }
.swatches button { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--rule); padding: 0; }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
.row.inh .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--muted); }
.swatches button.none { background: linear-gradient(135deg, transparent 45%, var(--danger) 45%, var(--danger) 55%, transparent 55%), var(--panel); }
.boxm { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; align-items: center; justify-items: center; padding: 6px; border: 1px dashed var(--rule); border-radius: 7px; background: var(--sunk); }
.boxm .mid { grid-column: 2; grid-row: 2; width: 100%; height: 24px; border-radius: 4px; background: var(--panel); border: 1px solid var(--rule); display: grid; place-items: center; font: 500 10px/1 var(--font-data); color: var(--muted); }
.boxm select { width: 100%; max-width: 76px; border: 1px solid var(--rule); background: var(--panel); border-radius: 5px; padding: 2px 3px; font: 500 11px/1.2 var(--font-data); }
.boxm select.set { border-color: var(--accent); color: var(--accent); }
.boxm select.bpset { border-color: var(--override); color: var(--override); }
.boxm .t { grid-column: 2; grid-row: 1; } .boxm .r { grid-column: 3; grid-row: 2; } .boxm .b { grid-column: 2; grid-row: 3; } .boxm .l { grid-column: 1; grid-row: 2; }
.anchor-wrap { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.anchor { display: grid; grid-template-columns: repeat(3, 16px); gap: 3px; padding: 4px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sunk); }
.anchor button { width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--rule); background: var(--panel); padding: 0; }
.anchor button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.rngc { display: grid; grid-template-columns: minmax(0, 1fr) 54px 10px; gap: 6px; align-items: center; }
.rngc .num { width: 100%; font: 500 11.5px/1 var(--font-data); padding: 4px 5px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); color: var(--ink); text-align: right; }
.rngc .pc { font: 500 11px/1 var(--font-data); color: var(--muted); }
.rngc input { width: 100%; accent-color: var(--accent); }
.livestat { margin: 0 0 8px; padding: 7px 9px 7px 24px; border-radius: 7px; background: var(--sunk); font-size: 12px; line-height: 1.4; position: relative; }
.livestat::before { content: ''; position: absolute; left: 10px; top: 12px; width: 7px; height: 7px; border-radius: 50%; background: #b45309; }
.livestat[data-state=live]::before { background: #15803d; }
.fields { display: grid; gap: 2px; margin: 8px 0; }
.fieldrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 6px; text-align: left; color: var(--ink); cursor: pointer; }

.chips2 .hint { width: 100%; display: flex; gap: 4px; align-items: center; }
.chip2 { border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 2px 8px; font: 500 11px/1.4 var(--font-data); color: var(--ink); cursor: pointer; }
.chip2:hover { border-color: var(--accent); }
details.adv { margin: 4px 0 6px; } details.adv summary { cursor: pointer; font-size: 12px; color: var(--muted); padding: 4px 0; }
.warnhint { color: var(--warn); }
.pwmeter { font-size: 12px; margin: 2px 0 8px; padding-left: 10px; border-left: 3px solid var(--rule); }
.pwmeter.weak, .pwmeter.none { border-color: var(--danger); color: var(--danger); } .pwmeter.ok { border-color: var(--warn); } .pwmeter.strong { border-color: #15803d; }
.serp { border: 1px solid var(--rule); border-radius: 9px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel); display: grid; gap: 3px; }
.serp cite { font: 400 12px/1.3 system-ui, sans-serif; color: #4d5156; font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.serp b { font: 400 17px/1.3 system-ui, sans-serif; color: #1a0dab; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.serp p { margin: 0; font: 400 13px/1.45 system-ui, sans-serif; color: #4d5156; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cnt2 { display: block; margin-top: 3px; font: 500 10.5px/1 var(--font-data); color: var(--muted); } .cnt2.bad { color: var(--danger); } .cnt2.bad { color: var(--danger); }
.seock { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.seock li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 7px; font-size: 12.5px; line-height: 1.4; }
.seock li .ic { margin-top: 2px; } .seock li.ok .ic { color: #15803d; } .seock li.warn .ic { color: var(--warn); }
.seock li span small { display: block; color: var(--muted); }
.botrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--rule); font-size: 12.5px; }
.botrow small { display: block; color: var(--muted); font-size: 11.5px; }
.botrow code { font: 600 11.5px/1.2 var(--font-data); }
.tile.live .ic { color: var(--accent); }
.rngc output { font: 500 11.5px/1 var(--font-data); text-align: right; }
.hint { color: var(--muted); font-size: 12px; margin: 0; }
.hint b { color: var(--ink); }
.linkpick { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sunk); }
.linkpick .go { display: flex; gap: 6px; align-items: center; }
.sect { padding: 10px 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
.sect h3 { margin: 0; font: 600 11px/1 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.pal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.pal button { border: 1px solid var(--rule); background: var(--panel); border-radius: 7px; padding: 6px; text-align: left; display: grid; gap: 5px; }
.pal button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pal .chips { display: flex; height: 14px; border-radius: 3px; overflow: hidden; }
.pal .chips i { display: block; }
.pal span { font-weight: 600; font-size: 12px; }
.tokrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.tokrow input[type="color"] { width: 26px; height: 22px; padding: 0; border: 1px solid var(--rule); border-radius: 5px; background: none; }
.tokrow code { font: 500 11px/1 var(--font-data); color: var(--muted); }
.tokrow small { color: var(--muted); }
.cpair { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; font-size: 12px; }
.cpair code { font: 500 11px/1 var(--font-data); }
.cpair .ok { color: var(--ok); font-weight: 700; } .cpair .bad { color: var(--danger); font-weight: 700; }
.fontpairs { display: grid; gap: 4px; }
.fontpairs button { border: 1px solid var(--rule); background: var(--panel); border-radius: 7px; padding: 7px 8px; text-align: left; display: grid; gap: 2px; }
.fontpairs button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.fontpairs b { font-size: 17px; font-weight: 700; line-height: 1.1; }
.fontpairs small { color: var(--muted); }
.rng { display: grid; grid-template-columns: 82px minmax(0, 1fr) 46px; gap: 6px; align-items: center; }
.rng label { color: var(--muted); }
.rng output { font: 500 11.5px/1 var(--font-data); text-align: right; }
.rng input { width: 100%; accent-color: var(--accent); }
.vers { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.vers li { border: 1px solid var(--rule); border-radius: 7px; padding: 7px 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; align-items: center; }
.vers li code { font: 500 10.5px/1.3 var(--font-data); color: var(--muted); grid-column: 1 / -1; word-break: break-all; }
.oplog { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font: 400 10.5px/1.35 var(--font-data); }
.oplog li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.oplog li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oplog li span:last-child { color: var(--muted); }

/* popovers */
.pop { position: fixed; z-index: 40; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 12px 36px rgba(0,0,0,.18); padding: 10px; max-height: min(78vh, 640px); overflow: auto; width: min(380px, calc(100vw - 16px)); }
.pop h4 { margin: 2px 2px 8px; font: 600 11px/1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pop .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-bottom: 10px; }
.pop .tile { border: 1px solid var(--rule); background: var(--panel); border-radius: 8px; padding: 9px 6px; display: grid; justify-items: center; gap: 6px; font-weight: 600; font-size: 12px; text-align: center; }
.pop .tile:hover { border-color: var(--accent); color: var(--accent); }
.pop .tile .ic { width: 20px; height: 20px; }
.pop .menu { display: grid; gap: 2px; }
.pop .menu button { border: 0; background: transparent; text-align: left; padding: 7px 8px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-weight: 500; }
.pop .menu button:hover { background: var(--sunk); }
.pop .menu button small { margin-left: auto; color: var(--muted); font: 500 11px/1 var(--font-data); }
.pop .menu .on { color: var(--accent); }
.pop .sep { height: 1px; background: var(--rule); margin: 5px 0; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.checks li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; padding: 7px 6px; border-radius: 7px; }
.checks li:hover { background: var(--sunk); }
.checks li .st { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: var(--accent-ink); }
.checks li .st .ic { width: 11px; height: 11px; stroke-width: 2.2; }
.checks li.pass .st { background: var(--ok); } .checks li.warn .st { background: var(--warn); } .checks li.fail .st { background: var(--danger); }
.checks li b { display: block; font-size: 12.5px; }
.checks li p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.checks li .acts { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.ratio { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 5px; border: 1px solid var(--rule); }
.ratio i { display: block; height: 100%; }
.checkhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.checkhead p { margin: 0; color: var(--muted); font-size: 12px; }

/* status bar */
.status { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 5px 14px; border-top: 1px solid var(--rule); background: var(--panel); font: 500 11px/1.3 var(--font-data); color: var(--muted); }
.status b { color: var(--ink); font-weight: 500; }
.toast { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-weight: 600; z-index: 50; box-shadow: 0 6px 24px rgba(0,0,0,.2); max-width: calc(100vw - 32px); }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(10, 12, 10, .5); display: grid; place-items: center; padding: 16px; z-index: 60; }
.sheet { width: min(900px, 100%); max-height: calc(100% - 32px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; }
.sheet .shead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sheet h2 { margin: 0; font-size: 18px; margin-right: auto; }
.sheet textarea { width: 100%; min-height: 320px; height: 100%; font: 400 11.5px/1.45 var(--font-data); border: 1px solid var(--rule); border-radius: 8px; background: var(--sunk); padding: 10px; resize: none; }
.sheet .acts { display: flex; justify-content: flex-end; gap: 8px; align-items: center; flex-wrap: wrap; }
.sheet.ask { width: min(480px, 100%); grid-template-rows: auto; gap: 12px; }
.askhead { display: flex; gap: 10px; align-items: center; }
.askic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--comp) 14%, transparent); color: var(--comp); flex: none; }
.sheet.ask h2 { font-size: 16px; margin: 0; }
.sheet.ask p { margin: 0; color: var(--muted); line-height: 1.5; }
.askrem { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.sheet.ask .acts { justify-content: stretch; }
.sheet.ask .acts .btn { flex: 1 1 auto; justify-content: center; }
.btn.compbtn { background: var(--comp); border-color: var(--comp); color: #fff; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    <div class="logo"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="5" fill="var(--accent)"/><path d="M5.5 6h9M5.5 10h5.5M5.5 14h3" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"/></svg>DEFXN Studio</div>

    <button class="btn quiet pagebtn" id="btnPage" aria-haspopup="dialog" title="Switch page"></button>
    <div class="seg" id="view" role="group" aria-label="View">
      <button data-v="design" aria-pressed="true" title="Design the current page"><svg class="ic"><use href="#i-design"/></svg>Design</button>
      <button data-v="map" aria-pressed="false" title="See every page and how they link"><svg class="ic"><use href="#i-sitemap"/></svg>Sitemap</button>

    <div class="spacer"></div>
    <span class="bp-note" id="bpNote" hidden></span>
    <div class="seg" id="devices" role="group" aria-label="Preview size">
      <button data-d="0" aria-pressed="true" title="Desktop · 1280 px" aria-label="Desktop"><svg class="ic"><use href="#i-desktop"/></svg></button>
      <button data-d="1" aria-pressed="false" title="Tablet · 820 px" aria-label="Tablet"><svg class="ic"><use href="#i-tablet"/></svg></button>
      <button data-d="2" aria-pressed="false" title="Phone · 390 px" aria-label="Phone"><svg class="ic"><use href="#i-phone"/></svg></button>
    </div>
    <button class="btn icon quiet" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="ic"><use href="#i-undo"/></svg></button>
    <button class="btn icon quiet" id="btnRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg class="ic"><use href="#i-redo"/></svg></button>
    <button class="btn quiet score" id="btnCheck" aria-haspopup="dialog" title="Check this page against the design rules"><svg class="ic"><use href="#i-shield"/></svg>Design check <b id="scoreBadge">–</b></button>
    <div class="seg" id="mode" role="group" aria-label="Mode">
      <button data-m="edit" aria-pressed="true" title="Edit"><svg class="ic"><use href="#i-cursor"/></svg>Edit</button>
      <button data-m="live" aria-pressed="false" title="Use the site like a visitor"><svg class="ic"><use href="#i-play"/></svg>Live</button>
    </div>
    <button class="btn icon quiet" id="btnMore" aria-haspopup="dialog" title="More" aria-label="More"><svg class="ic"><use href="#i-more"/></svg></button>
    <button class="btn" id="btnCmsSave" title="Write changed manifests, articles, and SEO through the DEFXN CMS"><svg class="ic"><use href="#i-check"/></svg>Save DEFXN</button>

  <div class="work">
    <aside class="left" aria-label="Structure">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabLayers" aria-selected="true"><svg class="ic"><use href="#i-layers"/></svg>Layers</button>
        <button role="tab" id="tabPages" aria-selected="false"><svg class="ic"><use href="#i-page"/></svg>Pages</button>
        <button role="tab" id="tabLib" aria-selected="false"><svg class="ic"><use href="#i-comp"/></svg>Library</button>
      </div>
      <ul class="list" id="layers" role="tree" aria-label="Page layers"></ul>
      <div id="libPane" hidden></div>
      <div id="pagesPane" hidden>
        <ul class="list" id="pages" aria-label="Pages"></ul>
      </div>
    </aside>

    <main class="canvas-wrap" id="canvasWrap">
      <div id="designView">
        <div class="devlabel"><span id="devName">Desktop · 1280 px</span><span id="devScale"></span></div>
        <div class="compbar" id="compBar" hidden><svg class="ic"><use href="#i-comp"/></svg><span id="compBarText"></span><span class="spacer"></span><button class="btn small" id="compDone">Done</button></div>

          <iframe class="cms-preview" id="cmsPreview" title="Exact DEFXN site preview"></iframe>
          <div class="ov-pad" id="padT" hidden></div><div class="ov-pad" id="padR" hidden></div><div class="ov-pad" id="padB" hidden></div><div class="ov-pad" id="padL" hidden></div>
          <div class="ov-box hover" id="hoverBox" hidden></div>
          <div class="ov-box" id="selBox" hidden></div>
          <div class="ov-tag" id="selTag" hidden>
            <button id="tagGrip" class="grip" title="Drag to move" aria-label="Drag to move"><svg class="ic sm"><use href="#i-move"/></svg></button>
            <span id="selName">Section</span>
            <button id="tagUp" title="Move up (Alt+↑)" aria-label="Move up"><svg class="ic sm"><use href="#i-up"/></svg></button>
            <button id="tagDown" title="Move down (Alt+↓)" aria-label="Move down"><svg class="ic sm"><use href="#i-down"/></svg></button>
            <button id="tagParent" title="Select parent (Esc)" aria-label="Select parent"><svg class="ic sm"><use href="#i-parent"/></svg></button>
            <button id="tagDup" title="Duplicate (Ctrl+D)" aria-label="Duplicate"><svg class="ic sm"><use href="#i-copy"/></svg></button>

    <aside class="right" aria-label="Inspector">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabEl" aria-selected="true"><svg class="ic"><use href="#i-cursor"/></svg>Element</button>
        <button role="tab" id="tabTheme" aria-selected="false"><svg class="ic"><use href="#i-palette"/></svg>Theme</button>
        <button role="tab" id="tabSeo" aria-selected="false" title="Search engines and AI assistants"><svg class="ic"><use href="#i-search"/></svg>SEO</button>
      </div>
      <div id="paneEl"></div>
      <div id="paneTheme" hidden></div>
      <div id="paneSeo" hidden></div>
    </aside>
  </div>

  <footer class="status" id="status" aria-live="off"></footer>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
$('btnContentCms').addEventListener('click', () => {
  if (window.parent !== window) window.parent.postMessage({ type: 'defxn-cms-open-content' }, window.location.origin);
  else window.location.assign('admin-app.html');
});

/* =========================================================================
   STEP 1 CLEANUP (2026-10-17): the dense typed-array document engine (node
   table, PROPS/PI, CSS compiler, theme tokens, pages()/linkIndex() over the
   dense tree) that used to live here has been deleted outright -- it backed
   only the standalone/disconnected prototype canvas, which the owner
   confirmed deleting. See the approved plan at the top of this session's
   work (flickering-juggling-donut.md). Sitemap and design-checks are ported
   below to read real data (cmsRoutes/cmsSourceSite) instead.
   ========================================================================= */

/* =========================================================================
   Preview: the current page renders into a shadow root in the device frame
   ========================================================================= */
const frame = $('frame');
const cmsPreview = $('cmsPreview');
let editingComp = -1;
let restrictMode = null;
let rafQueued = false;
/* STEP 1 CLEANUP: render() (the dense tree -> shadow-DOM builder) is deleted along with the
   rest of the standalone engine; schedule()'s one remaining job is to batch every
   connected-mode repaint into a single animation frame, same as before minus render() and
   the alive[curPage]/editingComp dense re-liveness checks. */
function schedule() {
  if (rafQueued) return; rafQueued = true;
  requestAnimationFrame(() => {
    rafQueued = false;
    renderCompBar(); renderRestrictBar(); renderLayersPane(); renderPages(); renderLibrary(); renderInspector(); renderPageBtn();
    if (view === 'map') renderSitemap();
    renderStatus(); queueCheck(); refreshPop(); syncCmsPreview();
  });
}
/* restrictMode's own enter/exit/toggle, mirroring enterComp/exitComp exactly: force out of
   editingComp/live/map first (the same mutual exclusion enterComp itself already performs
   against live/map), then set the one state variable and re-render. */
function applyRestrictModeClass() { $('shell').classList.toggle('canvas-mode', restrictMode === 'canvas'); $('shell').classList.toggle('anim-mode', restrictMode === 'anim'); }
function enterRestrictMode(mode) {
  if (live) { live = false; for (const x of $('mode').children) x.setAttribute('aria-pressed', String(x.dataset.m === 'edit')); $('shell').classList.remove('live'); postCmsPreviewMode(); }
  if (view === 'map') setView('design');
  restrictMode = mode; applyRestrictModeClass(); closePop();
  /* Mirrors enterComp's own showLeft/showTab calls: anim mode's whole point is picking an
     element from the real Layers tree (kept visible for 'anim' only, see .canvas-mode .left
     above), so land there and on the Element tab (Part H's own panel) every time, rather
     than leaving whatever tab happened to be open before entering. Harmless for 'canvas'
     mode too -- its own CSS hides the left rail regardless of which tab is selected. */
  showLeft('layers'); showTab('tabEl', true);
  schedule();
}
function exitRestrictMode() { if (!restrictMode) return; restrictMode = null; applyRestrictModeClass(); schedule(); }
/* Switching canvas -> anim via the banner's own toggle (not enterRestrictMode) needs the
   same "land on the real Layers tree" landing enterRestrictMode already does -- canvas
   mode's CSS hides the whole left rail regardless of which tab was last selected, so
   whatever tab that was (often 'pages' or 'lib', never touched by canvas mode) would
   otherwise reappear once the left rail comes back for anim. The reverse direction (anim
   -> canvas) needs no equivalent call: canvas mode hides .left outright. */
function toggleRestrictMode() { if (restrictMode === 'canvas') restrictMode = 'anim'; else if (restrictMode === 'anim') restrictMode = 'canvas'; else return; applyRestrictModeClass(); if (restrictMode === 'anim') { showLeft('layers'); showTab('tabEl', true); } schedule(); }
$('restrictSwitch').addEventListener('click', toggleRestrictMode);
$('restrictDone').addEventListener('click', exitRestrictMode);
/* =========================================================================
   DEFXN CMS bridge. The visual document is a projection of the real content
   registries; bindings on editable nodes point back to manifest/article keys.
   ========================================================================= */
let cmsConnected = false, cmsSyncTimer = 0, cmsSourceSite = null, cmsPreviewRoute = '', cmsExactSelection = null, cmsExactSelections = [];
/* Real route list (admin.js's own studioRoutes(): deduplicated by path, {path, title,
   seoId, seoArticle, key} per route), replacing the deleted dense pages()/curPage -- fed
   directly by the 'defxn-studio-load'/'defxn-studio-preview-state' messages below, never
   built locally. cmsCurrentRoute is a real path string ('/', '/journal', ...), not a
   dense id, and drives syncCmsPreview()'s iframe src and the Pages tab/sitemap below. */
let cmsRoutes = [], cmsCurrentRoute = '/';
/* The real DEFXN site's own design tokens (css/themes.css's :root block, read 2026-10-16),
   mirrored here -- not imported -- because this file is a deliberately dependency-free
   single document with no <script src>. Canonical copy: js/content/layout.js's TEXT_TOKENS/
   FILL_TOKENS/etc.; keep both in sync by hand if the real site's token names ever change. */
const CMS_TEXT_TOKENS = ['text-strong', 'text', 'text-muted', 'text-faint', 'text-inverse'];
const CMS_FILL_TOKENS = ['canvas', 'surface', 'raised', 'nested', 'overlay', 'primary', 'complement', 'accent', 'trust', 'live', 'warning', 'danger', 'hidden', 'reference'];
const CMS_BORDER_TOKENS = ['border-subtle', 'border-default', 'border-strong'];
const CMS_FONT_TOKENS = ['display', 'sans', 'mono'];
const CMS_TYPE_SIZE_TOKENS = ['hero', 'h1', 'h2', 'h3', 'body', 'label', 'metadata'];
const CMS_RADIUS_TOKENS = ['none', 'card', 'control', 'panel'];
/* These four have no real site token (no gap/weight/line-height scale exists in css/*.css)
   -- fixed option lists mirroring js/content/layout.js's DISPLAY_TOKENS/etc, same reasoning
   as the token mirrors above: kept in sync by hand, not imported. */
const CMS_DISPLAY_TOKENS = ['stack', 'row', 'grid', 'block', 'hide'];
const CMS_ALIGN_TOKENS = ['stretch', 'start', 'center', 'end'];
const CMS_JUSTIFY_TOKENS = ['start', 'center', 'end', 'between'];
const CMS_LINE_HEIGHT_TOKENS = ['tight', 'snug', 'normal', 'loose'];
/* Canvas-only mode (Part G): mirrors js/content/canvas-transitions.js's own EFFECTS/
   EASINGS enums, same reasoning as the token lists above -- this document has no
   <script src> for the content modules, so the small fixed option lists are
   duplicated here as literals, kept in sync by hand. */
const CMS_CANVAS_EFFECTS = ['fade', 'fade-scale'];
const CMS_CANVAS_EASINGS = ['ease', 'ease-out', 'ease-in-out'];
const CMS_CANVAS_TRANSITIONS_DEFAULT = { version: 1, effect: 'fade', outDuration: 220, inDuration: 260, easing: 'ease' };
/* Animation-only mode (Part H): mirrors js/content/element-motion.js's own DIRECTIONS
   enum/default entry, same reasoning as the token/enum lists above -- this document has
   no <script src> for the content modules. CMS_CANVAS_EASINGS (above) is reused directly
   for this panel's own easing picker rather than copied a second time, per the plan's own
   "reuse Part G's easing list for consistency across the two new systems" instruction. */
const CMS_ELEMENT_MOTION_DIRECTIONS = ['up', 'down', 'left', 'right', 'none'];
const CMS_ELEMENT_MOTION_DEFAULT_ENTRY = { direction: 'up', distance: 8, duration: 260, delay: 0, easing: 'ease' };
/* The 6 generic block resolvers (js/resolvers/blocks/*.js) and their real prop names --
   mirrored, not imported, same reasoning as the token lists above. Canonical copy:
   js/content/components.js's RESOLVERS/RESOLVER_PROPS. */
const CMS_BLOCK_RESOLVERS = [
  ['RBLOCK_TEXT_V1', 'Text', ['heading', 'body', 'align', 'size']],
  ['RBLOCK_CTA_V1', 'Button / link', ['label', 'href', 'variant']],
  ['RBLOCK_IMAGE_V1', 'Image', ['src', 'alt', 'caption']],
  ['RBLOCK_CARD_V1', 'Card', ['icon', 'title', 'text']],
  ['RBLOCK_QUOTE_V1', 'Quote', ['quote', 'attribution']],
  ['RBLOCK_DIVIDER_V1', 'Divider', []],
];
function cmsBlockResolverLabel(resolver) { const found = CMS_BLOCK_RESOLVERS.find((r) => r[0] === resolver); return found ? found[1] : resolver; }
function cmsBlockResolverProps(resolver) { const found = CMS_BLOCK_RESOLVERS.find((r) => r[0] === resolver); return found ? found[2] : []; }
function cmsSeoValue(value) {
  value = value || {};
  return { t: value.title || '', d: value.description || '', img: value.ogImage || '', can: value.canonical || '' };
}
function cmsPageSeo(site, route) {
  const seo = site.seo || { pages: {}, articles: {} };
  if (route.seoArticle) return cmsSeoValue((seo.articles || {})[route.seoArticle]);
  return cmsSeoValue((seo.pages || {})[route.seoId]);
}
/* STEP 1 CLEANUP: cmsRouteStatus/cmsManifestSections/cmsArticleSections/cmsSiteSpec and
   componentizeDefxn used to translate the real CMS payload (manifests/articles/SEO) into
   dense-tree page specs purely so this document's OWN dense-node text-editing UI (an
   "Authoritative content" textarea keyed by bindingOf()) could edit manifest/article/SEO
   fields through a second, invisible projection of the real content -- the dense `.frame`
   those nodes rendered into is never shown once connected (`.cms-connected .frame{display:
   none}`), and Content CMS (`btnContentCms`, one click away) already edits every one of
   those same manifest/article/SEO fields directly and visibly. That whole bridge -- the
   dense translation, bindingOf(), and collectCmsPatches()'s per-field value walk -- is
   deleted with Step 1 rather than ported: it duplicated Content CMS's own editors instead
   of being Studio-specific capability. Flagged plainly, same as the Versions/export
   deletion below: if the owner wants Studio to edit manifest/article/SEO text directly
   again, that is new work for a later step, not a port.
   collectCmsPatches() stays as an empty stub so `$('btnCmsSave')`'s existing relay (below)
   keeps working unchanged -- it simply has nothing dense-sourced left to report. */
function collectCmsPatches() { return []; }
function queueCmsSync() {
  if (!cmsConnected || window.parent === window) return;
  clearTimeout(cmsSyncTimer);
  cmsSyncTimer = setTimeout(() => window.parent.postMessage({ type: 'defxn-studio-patch', patches: collectCmsPatches() }, window.location.origin), 180);
}
function postCmsPreviewState() {
  if (!cmsConnected || !cmsSourceSite || !cmsPreview.contentWindow) return;
  cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-state', site: cmsSourceSite }, window.location.origin);
}
function postCmsPreviewMode() {
  if (!cmsConnected || !cmsPreview.contentWindow) return;
  cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-mode', mode: live ? 'live' : 'edit' }, window.location.origin);
}
/* `key` is optional and only ever passed by the Layers panel's eye icon (Part B): it lets a
   hide toggle target a row that is not the current selection, reusing the exact same
   ArkLayout.set() mechanism (via js/main.js's setCmsLayoutFrameForKey) rather than first
   having to select that row. Every existing caller (Frame/Layout/Spacing/Typography/Fill/
   Size/Effects) omits it and keeps acting on cmsExactSelection, unchanged. */
function postCmsLayoutCommand(frame, key) {
  if (!cmsConnected || !cmsPreview.contentWindow) return;
  cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-layout-command', frame, key }, window.location.origin);
}
function postCmsLayoutReset() {
  if (!cmsConnected || !cmsPreview.contentWindow) return;
  cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-layout-reset', breakpoint: ['desktop', 'tablet', 'phone'][device] }, window.location.origin);
}
/* Frame/Layout/Spacing/Typography/Fill/Size/Effects edits, and group/ungroup/align/
   distribute, all post straight to the iframe and never touched this page's own
   undoStack/redoStack (the dense-node projection's own history, used for content edits) --
   so Ctrl+Z silently did nothing for any style or structural edit. The real undo history for
   these lives in the iframe next to cmsLayoutDraft (js/main.js), covering every operation
   uniformly; this page just relays the request and tracks whether one is available so
   undo()/redo() below can try it first, and so the toolbar buttons reflect it. */
let cmsLayoutCanUndo = false, cmsLayoutCanRedo = false;
function postCmsLayoutUndo() { if (!cmsConnected || !cmsPreview.contentWindow) return; cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-layout-undo' }, window.location.origin); }
function postCmsLayoutRedo() { if (!cmsConnected || !cmsPreview.contentWindow) return; cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-layout-redo' }, window.location.origin); }
/* STEP 1 CLEANUP: undo()/redo() used to fall back to this document's own dense undoStack/
   redoStack when the connected relay had nothing to undo; that dense op-log is deleted
   along with the rest of the standalone engine, so the only real undo history left is the
   one already relayed from the iframe (see the comment above). */
function undo() { if (cmsLayoutCanUndo) postCmsLayoutUndo(); }
function redo() { if (cmsLayoutCanRedo) postCmsLayoutRedo(); }
/* Grouping lives in ArkLayout (the real DOM), not the CMS content tree the Layers tab
   walks, so a new group never showed up anywhere in the sidebar -- not a UI oversight, the
   two are genuinely different trees. This is that reflection: the iframe reports the
   current route's real groups on every selection/group/ungroup/ready message, and a group
   here is clickable to select it back in the canvas. */
let cmsGroups = [];
function postCmsSelectGroup(id) { if (!cmsConnected || !cmsPreview.contentWindow) return; cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-select-group', id }, window.location.origin); }
/* Part B of the follow-up Studio plan: a real layers tree for connected mode. The iframe
   reports the current route's real DOM tree (js/main.js's cmsRealTree) on every ready/
   select/layout-change/components-replace message, the same "iframe reports its own real
   state" pattern cmsGroups/cmsComponentAnchors above already use -- never a separate poll. */
let cmsTree = [];
/* Select any annotated element by its stable key -- generalizes postCmsSelectGroup's
   existing message (select-by-group-id) rather than inventing a sibling message type, since
   js/main.js's handler for it is a two-line difference, not a different operation. */
function postCmsSelectKey(key) { if (!cmsConnected || !cmsPreview.contentWindow) return; cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-select-group', key }, window.location.origin); }
/* Rename a Layers panel row: writes through ArkLayout.setLabel inside the iframe, the same
   draft-mutate-then-relay shape every other layout edit already follows. */
function postCmsSetLabel(key, label) { if (!cmsConnected || !cmsPreview.contentWindow) return; cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-set-label', route: cmsPreviewRoute, key, label }, window.location.origin); }
/* Delete/Backspace in connected mode: keyboard focus normally lives inside cmsPreview's own
   document once a real element is selected there (js/main.js gained its own keydown listener
   for that, Part A), so this parent handler's Delete/Backspace branch below only actually
   needs this for the one case where focus stayed in THIS document instead -- e.g. right
   after clicking a "Groups on this page" row, a parent-document button. js/main.js already
   knows the real selection (cmsPreviewSelected); this just asks it to act on it, the same
   "forward to the iframe" shape postCmsSelectGroup/postCmsLayoutOperation already use. */
function postCmsRemoveSelection() { if (!cmsConnected || !cmsPreview.contentWindow) return; cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-remove-selection' }, window.location.origin); }
/* Reusable components (js/content/components.js): the current route's declared anchors,
   reported by the preview iframe on every ready/select/components-replace message -- the
   same "the iframe reports its own real state" pattern cmsGroups above already uses. */
let cmsComponentAnchors = [];
function postCmsComponentsCommand(payload) {
  if (!cmsConnected || !cmsPreview.contentWindow) return;
  cmsPreview.contentWindow.postMessage(Object.assign({ type: 'defxn-cms-preview-components-command' }, payload), window.location.origin);
}
function cmsNextComponentId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
/* Layered states (js/content/states.js): add-state/remove-state/remove-group/set-
   trigger/set-current all post straight to the iframe, same shape as
   postCmsComponentsCommand above -- creating the group itself ("Make into states")
   is a direct call inside the iframe instead, since it acts on the selection that
   already lives there (see js/main.js's cmsMakeStates, mirroring cmsGroupSelection). */
function postCmsStatesCommand(payload) {
  if (!cmsConnected || !cmsPreview.contentWindow) return;
  cmsPreview.contentWindow.postMessage(Object.assign({ type: 'defxn-cms-preview-states-command' }, payload), window.location.origin);
}
/* Canvas-only mode (Part G): a field edit (effect/duration/easing) posts straight to
   the iframe -- the exact same "this document has no copy of the real sanitize(),
   compute it once inside the iframe that does" shape as postCmsStatesCommand above --
   and "Preview this transition" is a separate one-shot message with no patch, handled
   entirely inside the iframe against its own persistent layer. */
function postCmsCanvasTransitionsCommand(patch) {
  if (!cmsConnected || !cmsPreview.contentWindow) return;
  cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-canvas-transitions-command', patch }, window.location.origin);
}
function postCmsCanvasTransitionPreview() {
  if (!cmsConnected || !cmsPreview.contentWindow) return;
  cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-canvas-transitions-preview' }, window.location.origin);
}
/* Animation-only mode (Part H): the exact same shape as postCmsCanvasTransitionsCommand/
   postCmsCanvasTransitionPreview above, substituting element-motion's own route+key
   addressing (resolved inside the iframe from cmsPreviewSelected, the same selection
   cmsExactSelection here already mirrors) for canvas-transitions' single global object. */
function postCmsElementMotionCommand(patch) {
  if (!cmsConnected || !cmsPreview.contentWindow) return;
  cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-element-motion-command', patch }, window.location.origin);
}
function postCmsElementMotionPreview(key) {
  if (!cmsConnected || !cmsPreview.contentWindow) return;
  cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-element-motion-preview', key }, window.location.origin);
}
function postCmsLayoutOperation(operation) {
  if (!cmsConnected || !cmsPreview.contentWindow) return;
  cmsPreview.contentWindow.postMessage({ type: 'defxn-cms-preview-layout-operation', operation }, window.location.origin);
}
/* STEP 1 CLEANUP: selectCmsPreviewKey() resolved a manifest-field key back to the (now
   deleted) dense bound node so the deleted "Authoritative content" textarea could edit it
   -- see the note above collectCmsPatches(). Deleted with it; the real Layers tree (Part B)
   already selects real elements by key via postCmsSelectKey/cmsExactSelection, unaffected. */
function syncCmsPreview(force) {
  if (!cmsConnected) return;
  const route = cmsCurrentRoute || '/';
  if (force || cmsPreviewRoute !== route || !cmsPreview.getAttribute('src')) {
    cmsExactSelection = null; cmsExactSelections = [];
    cmsPreviewRoute = route;

  const words = (el) => (el.textContent || '').trim().split(/\s+/).filter(Boolean).length;
  const heads = [...doc.querySelectorAll('h1,h2,h3,h4')].filter(rendered);
  const h1s = heads.filter((el) => el.tagName === 'H1'), h2s = heads.filter((el) => el.tagName === 'H2');
  const paras = [...doc.querySelectorAll('p')].filter((el) => rendered(el) && words(el) > 0);
  // 1 one clear H1
  add({ law: 'Hierarchy', title: 'One H1 says what the page is about', status: h1s.length === 1 ? 'pass' : 'fail', detail: h1s.length === 1 ? `"${h1s[0].textContent.trim().slice(0, 60)}"` : h1s.length ? `${h1s.length} H1s compete for attention.` : 'This page has no H1.' });
  // 2 H1 > H2 > paragraph
  const h1z = h1s.length ? Math.max(...h1s.map(fsz)) : 0, h2z = h2s.length ? Math.max(...h2s.map(fsz)) : 0;
  const bodyParas = paras.filter((el) => words(el) > 12), pz = bodyParas.length ? Math.max(...bodyParas.map(fsz)) : 0;
  const hierOk = (!h1s.length || !h2z || h1z > h2z * 1.1) && (!h2s.length || !pz || h2z > pz * 1.1);
  add({ law: 'Hierarchy', title: 'Biggest for the most important', status: hierOk ? 'pass' : 'warn', detail: hierOk ? `H1 ${Math.round(h1z)} px, H2 ${Math.round(h2z)} px, text ${Math.round(pz)} px.` : `Sizes are close: H1 ${Math.round(h1z)} px, H2 ${Math.round(h2z)} px, text ${Math.round(pz)} px.` });
  // 8 scannable
  const longP = paras.filter((el) => words(el) > 60);
  const sections = [...doc.querySelectorAll('section')].filter(rendered);
  const bare = sections.filter((el) => !el.querySelector('h1,h2,h3,h4') && words(el) > 40);
  add({ law: 'Scanning', title: 'Easy to scan', status: longP.length || bare.length ? 'warn' : 'pass', detail: longP.length || bare.length ? `${longP.length ? `${longP.length} paragraph${longP.length > 1 ? 's' : ''} over 60 words. ` : ''}${bare.length ? `${bare.length} section${bare.length > 1 ? 's' : ''} with no heading.` : ''}` : 'Short paragraphs, and every section has a heading.' });
  // 9 lead with the point
  const actions = [...doc.querySelectorAll('a[href],button')].filter(rendered);
  const firstActTop = actions.length ? Math.min(...actions.map((el) => el.getBoundingClientRect().top)) : Infinity;
  const leadOk = h1s.length && h1s[0].getBoundingClientRect().top < 640 && (route.seoArticle || firstActTop < 760);
  add({ law: 'Layout', title: 'Lead with the point', status: leadOk ? 'pass' : 'warn', detail: leadOk ? 'The H1 and a next step are visible without scrolling.' : 'Put the H1 and one clear call to action in the first screen.' });
  // 10 links work (site-wide, real manifest link fields)
  const li = realLinkIndex(), bad = li.filter((l) => !l.ok);
  add({ law: 'Friction', title: 'Every link goes somewhere', status: bad.length ? 'fail' : 'pass', detail: bad.length ? `${bad.length} link${bad.length > 1 ? 's point' : ' points'} to a missing route.` : `${li.length} internal links, all working.` });
  // 11 every page reachable
  const inbound = new Set(li.filter((l) => l.ok && (l.tgt !== l.src || l.src === 'nav')).map((l) => l.tgt));
  const orph = cmsRoutes.filter((r) => r.path !== '/' && !inbound.has(r.path));
  add({ law: 'Friction', title: 'Every page can be reached', status: orph.length ? 'warn' : 'pass', detail: orph.length ? `Nothing links to ${orph.map((r) => r.path).join(', ')}.` : 'Every page has at least one link to it.' });
  // 12 search readiness (real SEO: cmsPageSeo/cmsSeoValue are pure functions over cmsSourceSite)
  const seo = cmsPageSeo(cmsSourceSite || {}, route);
  const title = seo.t || route.title || cmsCurrentRoute, desc = seo.d || '';
  const titleOk = title.length >= 15 && title.length <= 60, descOk = desc.length >= 50 && desc.length <= 160;
  add({ law: 'Search', title: 'Ready for search results', status: titleOk && descOk ? 'pass' : 'warn', detail: `Title ${title.length} chars${titleOk ? '' : ' (aim for 15-60)'} · description ${desc.length} chars${descOk ? '' : desc ? ' (aim for 50-160)' : ' (missing)'}.`, fix: 'seo', fixLabel: 'Open SEO' });
  // 13 AI assistants (site-wide bot policy, real cmsSourceSite.seo.site.bots)
  const siteSeo = (cmsSourceSite && cmsSourceSite.seo && cmsSourceSite.seo.site) || {};
  const bots = siteSeo.bots || {};
  const answerBotsOpen = AI_BOTS.filter(([b, , train]) => !train && (bots[b] || 'allow') === 'allow').length, answerBotsTotal = AI_BOTS.filter((b) => !b[2]).length;
  add({ law: 'AI', title: 'Answer-ready for AI assistants', status: answerBotsOpen > 0 ? 'pass' : 'warn', detail: `${answerBotsOpen} of ${answerBotsTotal} answer/search bots allowed.`, fix: 'seo', fixLabel: 'Open SEO' });
  lastChecks = out;
  const score = out.filter((c) => c.status === 'pass').length;
  const badge = $('scoreBadge'), btn = $('btnCheck'), frac = score / out.length;
  badge.textContent = `${score}/${out.length}`; btn.classList.remove('good', 'mid', 'bad'); btn.classList.add(frac >= 0.85 ? 'good' : frac >= 0.6 ? 'mid' : 'bad');
  return out;
}
let checkT = 0;
function queueCheck() { clearTimeout(checkT); checkT = setTimeout(() => { if (view === 'design' && !restrictMode) { runChecks(); if (popAnchor === $('btnCheck')) refreshPop(); renderStatus(); } }, 450); }
function applyFix(c) {
  if (c.fix === 'seo') { closePop(); showTab('tabSeo'); return; }
}
$('btnCheck').addEventListener('click', (e) => { runChecks(); openPop(e.currentTarget, (p) => {
  const checks = lastChecks;
  const head = document.createElement('div'); head.className = 'checkhead';
  head.innerHTML = `<div><b>Design check · ${esc(cmsCurrentRoute)}</b><p>${checks.filter((c) => c.status === 'pass').length} of ${checks.length} rules pass</p></div>`;
  p.appendChild(head);
  const ul = document.createElement('ul'); ul.className = 'checks';
  for (const c of checks) {
    const li = document.createElement('li'); li.className = c.status;
    li.innerHTML = `<span class="st">${ic(c.status === 'pass' ? 'check' : c.status === 'warn' ? 'info' : 'close')}</span><div><b></b><p></p></div>`;
    li.querySelector('b').textContent = `${c.law} · ${c.title}`; li.querySelector('p').textContent = c.detail;
    const d = li.lastChild;
    if (c.status !== 'pass' && c.fix) {
      const acts = document.createElement('div'); acts.className = 'acts';
      const f = document.createElement('button'); f.className = 'btn small primary'; f.innerHTML = ic('wand', 'sm') + (c.fixLabel || 'Fix'); f.addEventListener('click', () => applyFix(c)); acts.appendChild(f);
      d.appendChild(acts);
    }
    ul.appendChild(li);
  }
  p.appendChild(ul);
}, 'right'); });

/* STEP 1 CLEANUP: the dense-encoding "Versions" feature (encodeDense/namedTree/base32/
   cidOf/publish, and the "History" tab/#paneVer that showed it) is deleted with no
   replacement, per the approved plan -- it froze a sha-256-addressed snapshot of the
   dense-array format specifically, which no longer exists, and there is no existing real-
   site version-history feature to port it to. If the owner wants real version history for
   the connected site later, that is new work, not a port -- flagged plainly here, same as
   every other capability this pass drops rather than silently losing. Content CMS's own
   Save already writes and publishes the real site. */
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
/* STEP 1 CLEANUP: Export HTML / robots.txt-sitemap-llms.txt / Load sample / Start blank
   all operated on the deleted dense tree (exportHtml compiled it via compileNode(), which
   is gone) -- deleted with no replacement, same as the Versions feature above. The
   Shortcuts hint is trimmed to what still does something now that duplicate/group/ungroup/
   nudge/double-click-to-edit (all standalone-canvas-only) are gone.
*/
$('btnMore').addEventListener('click', (e) => openPop(e.currentTarget, (p) => {
  const k = document.createElement('p'); k.className = 'hint'; k.style.padding = '6px 8px 2px'; k.innerHTML = '<b>Shortcuts</b> · Ctrl+Z undo · Ctrl+Shift+Z redo · Esc closes a menu';
  p.appendChild(k);
}, 'right'));

/* =========================================================================
   Status bar, autosave, toolbar, keyboard
   ========================================================================= */
let statusT = 0, statusTimer = 0;
function renderStatus() {
  const now = performance.now(); if (now - statusT < 150) { if (!statusTimer) statusTimer = setTimeout(() => { statusTimer = 0; renderStatus(); }, 160); return; } statusT = now;
  $('status').innerHTML = `<span><b>${cmsRoutes.length}</b> routes</span><span>${cmsCurrentRoute}</span><span>${cmsLayoutCanUndo ? 'undo available' : 'no undo'}</span>`;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }

$('devices').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; device = +b.dataset.d; for (const x of $('devices').children) x.setAttribute('aria-pressed', String(x === b)); if (view !== 'design') setView('design'); layoutStage(); schedule(); });
$('mode').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  live = b.dataset.m === 'live'; for (const x of $('mode').children) x.setAttribute('aria-pressed', String(x === b));
  $('shell').classList.toggle('live', live); closePop();
  postCmsPreviewMode();
  if (live && restrictMode) exitRestrictMode();
  if (live && view !== 'design') setView('design');
  layoutStage(); schedule();
});
$('btnUndo').addEventListener('click', undo);
$('btnRedo').addEventListener('click', redo);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && popEl) { const a = popAnchor; closePop(); if (a) a.focus(); return; }
  if (e.key === 'Escape' && restrictMode) { exitRestrictMode(); return; }
  const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
  if (typing || live || restrictMode || view !== 'design') return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); postCmsRemoveSelection(); }
});
window.addEventListener('resize', layoutStage);

window.addEventListener('message', (event) => {
  if (event.origin !== window.location.origin || !event.data) return;
  if (event.source === cmsPreview.contentWindow) {
    if (event.data.type === 'defxn-cms-preview-ready') { if (event.data.groups) cmsGroups = event.data.groups; if (event.data.anchors) cmsComponentAnchors = event.data.anchors; if (event.data.tree) cmsTree = event.data.tree; toast('Exact DEFXN preview updated from unsaved CMS drafts.'); renderInspector(); renderLayersPane(); libKey = ''; renderLibrary(); }
    else if (event.data.type === 'defxn-cms-preview-error') toast('Preview update failed: ' + event.data.message);
    else if (event.data.type === 'defxn-cms-preview-select') {
      cmsExactSelection = event.data.selection || null;
      cmsExactSelections = event.data.selections || (cmsExactSelection ? [cmsExactSelection] : []);
      if (event.data.groups) cmsGroups = event.data.groups;
      if (event.data.tree) cmsTree = event.data.tree;
      renderLayersPane();
      renderInspector();
    } else if (event.data.type === 'defxn-cms-preview-components-replace') {
      if (cmsSourceSite) cmsSourceSite.components = event.data.components;
      if (event.data.anchors) cmsComponentAnchors = event.data.anchors;
      if (event.data.tree) cmsTree = event.data.tree;
      window.parent.postMessage({ type: 'defxn-studio-components-replace', components: event.data.components }, window.location.origin);
      libKey = ''; renderLibrary(); renderInspector(); renderLayersPane();
    } else if (event.data.type === 'defxn-cms-preview-states-replace') {
      if (cmsSourceSite) cmsSourceSite.states = event.data.states;
      if (event.data.anchors) cmsComponentAnchors = event.data.anchors;
      if (event.data.tree) cmsTree = event.data.tree;
      window.parent.postMessage({ type: 'defxn-studio-states-replace', states: event.data.states }, window.location.origin);
      renderInspector(); renderLayersPane();
    } else if (event.data.type === 'defxn-cms-preview-canvas-transitions-replace') {
      if (cmsSourceSite) cmsSourceSite.canvasTransitions = event.data.canvasTransitions;
      window.parent.postMessage({ type: 'defxn-studio-canvas-transitions-replace', canvasTransitions: event.data.canvasTransitions }, window.location.origin);
      renderInspector();
    } else if (event.data.type === 'defxn-cms-preview-element-motion-replace') {
      if (cmsSourceSite) cmsSourceSite.elementMotion = event.data.elementMotion;
      window.parent.postMessage({ type: 'defxn-studio-element-motion-replace', elementMotion: event.data.elementMotion }, window.location.origin);
      renderInspector();
    } else if (event.data.type === 'defxn-cms-preview-layout-change' && event.data.patch) {
      cmsExactSelection = event.data.selection || cmsExactSelection;
      cmsExactSelections = event.data.selections || cmsExactSelections;
      if (event.data.groups) cmsGroups = event.data.groups;
      if (event.data.tree) cmsTree = event.data.tree;
      window.parent.postMessage({ type: 'defxn-studio-layout-patch', patch: event.data.patch }, window.location.origin);
      renderInspector(); renderLayersPane();
    } else if (event.data.type === 'defxn-cms-preview-layout-replace' && event.data.layout) {
      if (event.data.tree) cmsTree = event.data.tree;
      window.parent.postMessage({ type: 'defxn-studio-layout-replace', layout: event.data.layout }, window.location.origin);
      renderLayersPane();
    } else if (event.data.type === 'defxn-cms-preview-layout-history') {
      cmsLayoutCanUndo = !!event.data.canUndo; cmsLayoutCanRedo = !!event.data.canRedo; renderInspector();
    } else if (event.data.type === 'defxn-cms-preview-notice') toast(event.data.message || 'That operation is unavailable for this selection.');
    else if (event.data.type === 'defxn-cms-preview-enter-canvas-mode') enterRestrictMode('canvas');
    return;
  }
  if (event.source !== window.parent) return;
  if (event.data.type === 'defxn-studio-load') {
    try {
      cmsSourceSite = event.data.site; cmsRoutes = event.data.routes || [];
      cmsConnected = true; cmsCurrentRoute = (cmsRoutes.find((r) => r.path === '/') || cmsRoutes[0] || { path: '/' }).path;
      $('shell').classList.add('cms-connected');
      cmsLayoutCanUndo = cmsLayoutCanRedo = false; schedule();
      syncCmsPreview(true); layoutStage();
      toast(`${cmsRoutes.length} real DEFXN routes loaded from Content CMS.`);
    } catch (error) { toast('Could not load DEFXN content: ' + error.message); }
  } else if (event.data.type === 'defxn-studio-preview-state') {
    cmsSourceSite = event.data.site; if (event.data.routes) cmsRoutes = event.data.routes; postCmsPreviewState();
  } else if (event.data.type === 'defxn-studio-saved') toast(event.data.message || (event.data.ok ? 'DEFXN content saved.' : 'Save failed.'));
});
$('btnCmsSave').addEventListener('click', () => {
  if (window.parent === window || !cmsConnected) { toast('Open Studio through DEFXN Content CMS to write the project files.'); return; }
  window.parent.postMessage({ type: 'defxn-studio-save', patches: collectCmsPatches() }, window.location.origin);
  toast('Saving changed DEFXN content…');
});

/* boot: Studio only ever runs embedded inside Content CMS now (window.parent !== window)
   -- the standalone-canvas boot path (restore a local dense document from localStorage, or
   build the sample/demo site) is deleted along with the rest of the standalone engine. If
   opened directly (not embedded), there is nothing to show until a real defxn-studio-load
   message arrives; this keeps that state honest instead of faking a document. */
$('shell').classList.add('cms-connected');
layoutStage(); renderLayersPane(); renderInspector(); renderPageBtn(); renderStatus();
if (window.parent !== window) window.parent.postMessage({ type: 'defxn-studio-ready' }, window.location.origin);
else toast('Open Studio through DEFXN Content CMS.');
})();
</script>
